<!-- Shown on the start screen under the Play button (see GameControlsFile in GXPEngine.Web.targets). -->
<table class="controls">
  <caption>Two players share one keyboard</caption>
  <thead>
    <tr>
      <th scope="col"></th>
      <th scope="col">Player 1</th>
      <th scope="col">Player 2</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <th scope="row">Move / jump / crouch</th>
      <td><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></td>
      <td><kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd></td>
    </tr>
    <tr>
      <th scope="row">Light / heavy punch</th>
      <td><kbd>Z</kbd> <kbd>X</kbd></td>
      <td><kbd>H</kbd> <kbd>J</kbd></td>
    </tr>
    <tr>
      <th scope="row">Light / heavy kick</th>
      <td><kbd>C</kbd> <kbd>V</kbd></td>
      <td><kbd>K</kbd> <kbd>L</kbd></td>
    </tr>
    <tr>
      <th scope="row">Confirm in menus</th>
      <td><kbd>C</kbd></td>
      <td><kbd>K</kbd></td>
    </tr>
    <tr>
      <th scope="row">Insert coin / pause</th>
      <td colspan="2"><kbd>P</kbd></td>
    </tr>
  </tbody>
</table>
<p class="note">Hold back to block. Built in C# (GXPEngine), compiled to WebAssembly.</p>
