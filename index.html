<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>WebGPU</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #gameCanvas {
      display: block;
      aspect-ratio: 16 / 9;
      width: min(100vw, 100vh * 16 / 9);
      height: auto;
    }
  </style>
</head>

<body>
  <canvas id="gameCanvas"></canvas>
  <script type="module" src="js/engine.js"></script>
</body>

</html>
